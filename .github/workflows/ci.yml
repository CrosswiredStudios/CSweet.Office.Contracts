name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet test CSweet.SatelliteOffice.Contracts.slnx -c Release
      - run: dotnet pack src/CSweet.SatelliteOffice.Contracts/CSweet.SatelliteOffice.Contracts.csproj -c Release --no-build -o artifacts/packages
      - uses: actions/upload-artifact@v4
        with: { name: packages, path: 'artifacts/packages/*.*nupkg' }
