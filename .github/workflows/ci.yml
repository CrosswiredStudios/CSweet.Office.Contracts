name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet build CSweet.Office.Contracts.slnx --configuration Release -p:UseLocalIsolation=false
      - run: dotnet pack src/CSweet.Office.Contracts/CSweet.Office.Contracts.csproj --configuration Release --no-build --output artifacts/packages -p:UseLocalIsolation=false
      - run: dotnet test CSweet.Office.Contracts.slnx --configuration Release --no-build -p:UseLocalIsolation=false
      - uses: actions/upload-artifact@v4
        with: { name: packages, path: 'artifacts/packages/*.*nupkg' }
