syntax = "proto3";

option csharp_namespace = "CSweet.Office.Contracts.ControlPlane";
package csweet.office.v1;

service OfficeGateway {
  rpc Connect(stream OfficeControlMessage) returns (stream HeadquartersControlMessage);
  rpc OpenWorkloadTunnel(stream WorkloadTunnelFrame) returns (stream WorkloadTunnelFrame);
  rpc DownloadArtifact(ArtifactDownloadRequest) returns (stream ArtifactChunk);
}

message OfficeControlMessage {
  string protocol_version = 1;
  string office_id = 2;
  int64 session_epoch = 3;
  oneof body {
    OfficeHeartbeat heartbeat = 10;
    AssignmentLeaseRenewal lease_renewal = 11;
    AssignmentStatusUpdate assignment_status = 12;
    AssignmentStopped assignment_stopped = 13;
    OfficeComputeResult compute_result = 14;
    OfficeComputeMaintenance compute_maintenance = 15;
  }
}

message HeadquartersControlMessage {
  string protocol_version = 1;
  string office_id = 2;
  int64 session_epoch = 3;
  oneof body {
    WorkloadAssignment assignment = 10;
    FenceAssignment fence = 11;
    DrainOffice drain = 12;
    GatewayHello hello = 13;
    AssignmentStopReceipt assignment_stop_receipt = 14;
    ReconcileAssignmentStop reconcile_assignment_stop = 15;
    OfficeComputeDispatch compute_dispatch = 16;
    OfficeComputeReceipt compute_receipt = 17;
    OfficeComputeReceipt compute_maintenance_receipt = 18;
  }
}

message GatewayHello { string assignment_signing_key_id = 1; bytes assignment_verification_public_key = 2; }
message OfficeHeartbeat {
  int64 occurred_at_unix_seconds = 1;
  int32 allocatable_cpu_count = 2;
  int32 allocatable_memory_mb = 3;
  int32 allocatable_disk_mb = 4;
  int32 maximum_concurrent_workloads = 5;
  repeated OfficeProviderInventory providers = 6;
  OfficeSecurityPosture security_posture = 7;
  string office_version = 8;
  OfficeComputeOffer compute_offer = 9;
}
// One machine-approved business partition. An absent offer opts out of new placements.
message OfficeComputeOffer {
  string organization_id = 1;
  string template_id = 2;
  string image_digest = 3;
  repeated string features = 4;
  int32 maximum_environments = 5;
  int32 cpu_count = 6;
  int32 memory_mib = 7;
  int32 disk_mib = 8;
}
// Packet and result bytes use the existing CSweet.Compute v1 encoding. The Office
// relays the Headquarters-signed packet unchanged to its local physical executor.
message OfficeComputeDispatch { bytes packet_json = 1; }
message OfficeComputeResult { bytes signed_result_json = 1; }
message OfficeComputeMaintenance { bytes signed_delivery_json = 1; }
message OfficeComputeReceipt {
  string operation_id = 1; int64 sequence = 2; string payload_digest = 3; bytes signature = 4;
}
message OfficeSecurityPosture {
  string profile = 1; bool mixed_use_host = 2; bool development_assignments_allowed = 3;
  repeated string enabled_controls = 4; repeated string missing_controls = 5;
  int64 evaluated_at_unix_seconds = 6;
}
message OfficeProviderInventory {
  string provider_id = 1; string provider_version = 2; string broker_protocol_version = 3;
  string guest_image_digest = 4; string certification_suite_version = 5;
  string certification_evidence_digest = 6; int64 certified_at_unix_seconds = 7;
  int64 certification_expires_at_unix_seconds = 8; bool supports_builder_workloads = 9;
  bool supports_runtime_workloads = 10; bool is_available = 11; string unavailable_reason = 12;
  bool supports_toolchain_build_workloads = 13;
  bool supports_public_internet = 14; bool supports_persistent_disk = 15;
}
message WorkloadAssignment {
  string assignment_id = 1; string workload_id = 2; int64 fencing_epoch = 3; string provider_id = 4;
  string specification_json = 5; string specification_sha256 = 6; string signature_key_id = 7;
  bytes signature = 8; int64 lease_expires_at_unix_seconds = 9; string artifact_read_token = 10;
  int64 issued_at_unix_seconds = 11; int32 authorization_version = 12;
}
message AssignmentLeaseRenewal { string assignment_id = 1; int64 fencing_epoch = 2; int64 requested_expiry_unix_seconds = 3; }
// Sent only after the Office has confirmed teardown of this exact execution attempt.
// Does not renew a lease or authorize execution. May fence an otherwise active attempt.
message AssignmentStopped {
  string assignment_id = 1; int64 fencing_epoch = 2;
  string provider_id = 3; string provider_instance_id = 4;
  // True only when the Office durably prevented creation of this attempt.
  bool never_created = 5;
}
// Allows a durable Office outbox entry to be retired after idempotent recording.
message AssignmentStopReceipt {
  string assignment_id = 1; int64 fencing_epoch = 2; bool accepted = 3;
}
// A teardown-only hint for an exact retired attempt. Never authorizes creation.
message ReconcileAssignmentStop {
  string assignment_id = 1; int64 fencing_epoch = 2; string provider_id = 3;
}
message AssignmentStatusUpdate {
  string assignment_id = 1; int64 fencing_epoch = 2; string status = 3; string failure_code = 4;
  string sanitized_failure = 5; string provider_instance_id = 6; string log_excerpt = 13;
  string result_artifact_locator = 14; string result_artifact_digest = 15;
  string result_artifact_signature = 16; string result_artifact_format_version = 17;
  string result_artifact_operating_system = 18; string result_artifact_architecture = 19;
}
message FenceAssignment { string assignment_id = 1; int64 fencing_epoch = 2; string reason = 3; }
message DrainOffice { bool drain = 1; string reason = 2; }
message WorkloadTunnelFrame {
  string office_id = 1; string assignment_id = 2; int64 fencing_epoch = 3;
  int64 sequence = 4; bytes content = 5; bool completed = 6; int64 session_epoch = 7;
}
message ArtifactDownloadRequest {
  string protocol_version = 1; string office_id = 2; int64 session_epoch = 3;
  string assignment_id = 4; int64 fencing_epoch = 5; string artifact_digest = 6;
  string artifact_read_token = 7; string transfer_id = 8;
}
message ArtifactChunk { int64 offset = 1; bytes content = 2; bool completed = 3; int64 total_size = 4; string sha256 = 5; }
